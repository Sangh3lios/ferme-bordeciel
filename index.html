<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registre de la Ferme — Bordeciel</title>
<style>
:root{--bg:#1c1713;--panel:#2a211b;--ink:#f1e4c5;--muted:#bba987;--gold:#c99b4b;--line:#5b4734}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3b2b20,#17120f 55%);color:var(--ink);font-family:Georgia,serif}header{padding:22px 28px;border-bottom:1px solid var(--line);background:#18120e;display:flex;justify-content:space-between;align-items:center}h1,h2{margin:.2em 0}.sub,.small{color:var(--muted)}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:linear-gradient(145deg,#30251e,#241b16);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}.metric{font-size:28px;color:#e3bc70}.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:var(--gold);color:#21170e;border:0;border-radius:5px;padding:10px 14px;font-weight:bold;cursor:pointer}button.secondary{background:#4b3a2c;color:var(--ink)}nav button.active{outline:2px solid #e3bc70}input,select{width:100%;padding:11px;background:#17120f;color:var(--ink);border:1px solid var(--line);border-radius:5px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:#d8b56e}.notice{padding:12px;border-left:3px solid var(--gold);background:#2a211b;margin:12px 0}.error{color:#ef9b92}.login{max-width:430px;margin:10vh auto}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:14px}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body></html>
